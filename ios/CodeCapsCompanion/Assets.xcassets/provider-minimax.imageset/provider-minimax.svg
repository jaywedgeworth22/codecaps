<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- MiniMax monogram.  A bold {M} in the CodeCaps accent teal that
       reads as "the agent" rather than the official brand.  Stroke-based
       so it stays crisp at 16pt menu-bar size and tints correctly under
       both template and standard rendering.  The braces use the same
       stroke weight as the M's verticals so the visual hierarchy reads
       flat. -->
  <style>
    path { stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      path { stroke: #FFFFFF; }
    }
  </style>
  <!-- Left brace: top curl + middle point + bottom curl -->
  <path d="M 4 4.5 Q 1.6 4.5 1.6 7 V 17 Q 1.6 19.5 4 19.5" />
  <!-- Right brace: top curl + middle point + bottom curl -->
  <path d="M 20 4.5 Q 22.4 4.5 22.4 7 V 17 Q 22.4 19.5 20 19.5" />
  <!-- Bold M: two verticals + a V-valley in the middle -->
  <path d="M 7 18.5 V 5.5 L 12 13.5 L 17 5.5 V 18.5" />
</svg>